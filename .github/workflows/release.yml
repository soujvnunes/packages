name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Opens/updates a "Version Packages" PR; when that PR merges, publishes to npm.
      - uses: changesets/action@v1
        with:
          # `pnpm run …` forces the package scripts. A bare `pnpm version` hits pnpm's built-in version command and would skip `changeset version` entirely.
          version: pnpm run version
          publish: pnpm run release
        env:
          # A PAT (not the default GITHUB_TOKEN) so the "Version Packages" PR is created by a user and
          # therefore TRIGGERS CI. A GITHUB_TOKEN-created PR does not start workflows (GitHub recursion
          # guard), so with a required-status-check branch ruleset the Version PR would never get its
          # check and could not merge. Falls back to GITHUB_TOKEN when RELEASE_PAT is unset.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
